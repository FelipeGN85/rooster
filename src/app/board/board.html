<div class="device">
  <div class="screen">
    <div class="cells" role="group" aria-label="Game board">
      @for (cell of cells(); track $index) {
        <button
          type="button"
          class="cell"
          [class.dim]="dimmed($index)"
          [disabled]="cell !== null || locked()"
          [attr.aria-label]="label($index, cell)"
          (click)="move.emit($index)"
        >
          @if (cell === 'X') {
            <svg class="mark x" viewBox="0 0 100 100" fill="none" aria-hidden="true">
              <path d="M18 18 L82 82 M82 18 L18 82" />
            </svg>
          } @else if (cell === 'O') {
            <svg class="mark o" viewBox="0 0 100 100" fill="none" aria-hidden="true">
              <circle cx="50" cy="50" r="34" />
            </svg>
          }
        </button>
      }
    </div>

    <svg class="lines" viewBox="0 0 300 300" aria-hidden="true">
      <path class="grid" d="M100 14 V286 M200 14 V286 M14 100 H286 M14 200 H286" />
      @if (strike(); as strike) {
        <svg:path class="strike" [class.o]="strike.mark === 'O'" [attr.d]="strike.d" />
      }
    </svg>
  </div>
</div>
