<!-- Comic lightning either side of the header, on wide screens only. -->
<svg class="bolt left" viewBox="0 0 80 130" aria-hidden="true">
  <path d="M22 4 L62 4 L42 44 L74 44 L20 124 L34 60 L6 60 Z" />
</svg>
<svg class="bolt right" viewBox="0 0 80 130" aria-hidden="true">
  <path d="M22 4 L62 4 L42 44 L74 44 L20 124 L34 60 L6 60 Z" />
</svg>

<!-- Pinned to the top while the page scrolls, as in Event Buddy. -->
<app-header (newRound)="online.newRound()" />

<!-- Phones: the rest of the screen under the header, so the board gets whatever room is left. -->
<div class="screen">
  <main>
    <h1 class="visually-hidden">Rooster tic-tac-toe: Bolt versus Ring</h1>

    <!-- Phones: one strip with both heads and scores, instead of the two big robots. -->
    <app-vs-strip class="phone-only" [sides]="sides()" [draws]="store.state().score.draw" />

    <p class="status" aria-live="polite" [style.--accent]="statusAccent()">
      {{ status() }}
      @if (quip(); as line) {
        <span class="quip phone-only" aria-hidden="true">· {{ line }}</span>
      }
    </p>

    <div class="arena">
      @for (side of sides(); track side.mark) {
        <app-player-card
          [class]="side.mark === 'X' ? 'side-x' : 'side-o'"
          [mark]="side.mark"
          [score]="side.score"
          [name]="side.name"
          [mood]="side.mood"
          [bubble]="side.bubble"
        />
      }

      <div class="stage">
        <!-- A comic starburst behind the board, turning very slowly. -->
        <svg class="burst" viewBox="-400 -400 800 800" aria-hidden="true">
          <path
            class="burst-outer"
            d="M390 0 L296 123 L276 276 L123 296 L0 390 L-123 296 L-276 276 L-296 123 L-390 0 L-296 -123 L-276 -276 L-123 -296 L0 -390 L123 -296 L276 -276 L296 -123 Z"
          />
          <path
            class="burst-inner"
            d="M300 0 L226 97 L212 218 L91 233 L0 308 L-91 233 L-212 218 L-226 97 L-300 0 L-226 -97 L-212 -218 L-91 -233 L0 -308 L91 -233 L212 -218 L226 -97 Z"
          />
        </svg>

        <app-board
          [cells]="store.state().cells"
          [win]="store.win()"
          [locked]="!online.canMove()"
          (move)="online.play($event)"
        />
      </div>
    </div>

    <div class="floor" aria-hidden="true"></div>

    <div class="actions">
      @if (store.over()) {
        <button type="button" class="btn btn-dark" (click)="online.newRound()">Play again</button>
      }
      <!-- Phones: the online game starts and ends from here; its details open as a sheet. -->
      @switch (online.status()) {
        @case ('idle') {
          <button type="button" class="btn btn-dark phone-only" (click)="online.host()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M10 14 a4 4 0 0 1 0 -5.66 l3 -3 a4 4 0 0 1 5.66 5.66 l-1.5 1.5 M14 10 a4 4 0 0 1 0 5.66 l-3 3 a4 4 0 0 1 -5.66 -5.66 l1.5 -1.5"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </svg>
            Play online
          </button>
        }
        @case ('connected') {
          <button type="button" class="btn btn-light phone-only" (click)="online.leave()">
            <span class="dot" aria-hidden="true"></span>
            Leave game
          </button>
        }
      }
      <button type="button" class="btn btn-light" (click)="online.resetScore()">Reset score</button>
      <span class="draws desktop-only"
        >Draws <strong>{{ store.state().score.draw }}</strong></span
      >
    </div>

    <app-online-panel />
  </main>
</div>

<app-footer />
