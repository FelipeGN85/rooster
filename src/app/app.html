<!-- Comic lightning either side of the header, on wide screens only. -->
<svg class="bolt left" viewBox="0 0 80 130" aria-hidden="true">
  <path d="M22 4 L62 4 L42 44 L74 44 L20 124 L34 60 L6 60 Z" />
</svg>
<svg class="bolt right" viewBox="0 0 80 130" aria-hidden="true">
  <path d="M22 4 L62 4 L42 44 L74 44 L20 124 L34 60 L6 60 Z" />
</svg>

<app-header (newRound)="online.newRound()" />

<main>
  <h1 class="visually-hidden">Rooster tic-tac-toe: Bolt versus Ring</h1>

  <p class="status" aria-live="polite" [style.--accent]="statusAccent()">{{ status() }}</p>

  <div class="arena">
    @for (side of sides(); track side.mark) {
      <app-player-card
        [class]="side.mark === 'X' ? 'side-x' : 'side-o'"
        [mark]="side.mark"
        [score]="side.score"
        [name]="side.name"
        [mood]="side.mood"
        [bubble]="side.bubble"
      />
    }

    <div class="stage">
      <!-- A comic starburst behind the board, turning very slowly. -->
      <svg class="burst" viewBox="-400 -400 800 800" aria-hidden="true">
        <path
          class="burst-outer"
          d="M390 0 L296 123 L276 276 L123 296 L0 390 L-123 296 L-276 276 L-296 123 L-390 0 L-296 -123 L-276 -276 L-123 -296 L0 -390 L123 -296 L276 -276 L296 -123 Z"
        />
        <path
          class="burst-inner"
          d="M300 0 L226 97 L212 218 L91 233 L0 308 L-91 233 L-212 218 L-226 97 L-300 0 L-226 -97 L-212 -218 L-91 -233 L0 -308 L91 -233 L212 -218 L226 -97 Z"
        />
      </svg>

      <app-board
        [cells]="store.state().cells"
        [win]="store.win()"
        [locked]="!online.canMove()"
        (play)="online.play($event)"
      />
    </div>
  </div>

  <div class="floor" aria-hidden="true"></div>

  <div class="actions">
    @if (store.over()) {
      <button type="button" class="btn btn-dark" (click)="online.newRound()">Play again</button>
    }
    <button type="button" class="btn btn-light" (click)="online.resetScore()">Reset score</button>
    <span class="draws">Draws <strong>{{ store.state().score.draw }}</strong></span>
  </div>

  <app-online-panel />
</main>

<app-footer />
